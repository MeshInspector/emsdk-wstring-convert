name: wstring_convert deprecation probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [ '4.0.19', '4.0.23', '5.0.0', '5.0.4', '5.0.5', '5.0.7', '6.0.0', '6.0.9' ]

    steps:
      - uses: actions/checkout@v5

      # MeshLib's own emscripten warning flags, verbatim from a failing compile line,
      # minus the -Werror so every cell reports instead of stopping at the first.
      - name: Plain compile
        run: |
          FLAGS="-std=gnu++20 -Wall -Wextra -Wdeprecated -Wno-missing-field-initializers -Wno-unknown-pragmas -Wno-sign-compare"
          IMG=emscripten/emsdk:${{ matrix.version }}-arm64
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ --version | head -1
          set +e
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -c repro.cpp -o /tmp/repro.o > out.log 2>&1
          set -e
          grep -q "is deprecated" out.log && W=yes || W=no
          echo "RESULT_PLAIN version=${{ matrix.version }} warning=$W"

      # The real build compiles this TU through a precompiled header, which is where
      # <locale> actually comes from. That is the one thing the reduction above lacks.
      - name: Compile through a PCH, as the real build does
        run: |
          FLAGS="-std=gnu++20 -Wall -Wextra -Wdeprecated -Wno-missing-field-initializers -Wno-unknown-pragmas -Wno-sign-compare"
          IMG=emscripten/emsdk:${{ matrix.version }}-arm64
          set +e
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -x c++-header pch.h -o pch.h.gch > pch.log 2>&1
          pchrc=$?
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -include-pch pch.h.gch -c repro.cpp -o /tmp/repro_pch.o > pchuse.log 2>&1
          set -e
          cat pch.log
          cat pchuse.log
          grep -q "is deprecated" pchuse.log && W=yes || W=no
          echo "RESULT_PCH version=${{ matrix.version }} pch_build_rc=$pchrc warning=$W"

      - name: Both, with -Werror as the real build has
        run: |
          FLAGS="-std=gnu++20 -Wall -Wextra -Wdeprecated -Wno-missing-field-initializers -Wno-unknown-pragmas -Wno-sign-compare -Werror"
          IMG=emscripten/emsdk:${{ matrix.version }}-arm64
          set +e
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -c repro.cpp -o /tmp/a.o > w1.log 2>&1
          plain=$?
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -x c++-header pch.h -o pchw.h.gch > /dev/null 2>&1
          docker run --rm -v "$PWD:/src" -w /src $IMG em++ $FLAGS -include-pch pchw.h.gch -c repro.cpp -o /tmp/b.o > w2.log 2>&1
          withpch=$?
          set -e
          echo "RESULT_WERROR version=${{ matrix.version }} plain_rc=$plain pch_rc=$withpch (0 = compiles, 1 = rejected)"
