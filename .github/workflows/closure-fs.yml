name: closure JSC_WRONG_ARGUMENT_COUNT on libfs.js

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [ '5.0.7', '6.0.9' ]
    steps:
      - uses: actions/checkout@v5
      - name: Run
        run: docker run --rm -e VERSION=${{ matrix.version }} -v "$PWD:/src" -w /src emscripten/emsdk:${{ matrix.version }}-arm64 bash run2.sh
